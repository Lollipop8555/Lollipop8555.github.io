<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b14" />
    <meta name="description" content="(oo)y Lollipop" />
    <meta name="keywords" content="Lollipop, (oo)y, (OO)T, \^^/Y, (--)y" />
    <meta name="author" content="Lollipop" />

    <!-- Open Graph：分享预览只留一个颜文字，不写自我评价 -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lollipop · Home" />
    <meta property="og:description" content="(oo)y" />

    <!-- 预加载字体（系统字体，无需联网） -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- 主题预应用，避免闪烁 -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('lollipop-theme');
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme = stored || (prefersLight ? 'light' : 'dark');
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>

    <title>Lollipop · Home</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
