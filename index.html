<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0b14" />
    <meta name="description" content="Lollipop 的 GitHub 项目集中展示门户 —— 用 Vue 3 打造的极简动态主页，集合了今天吃点啥、天气、每日星座、幸运签 等有趣的小工具。" />
    <meta name="keywords" content="Lollipop, GitHub Pages, Vue 3, 个人主页, 项目集合, 今天吃点啥, 每日星座, 幸运签" />
    <meta name="author" content="Lollipop" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Lollipop · Home" />
    <meta property="og:description" content="一个优雅的 GitHub 项目集中展示入口。" />

    <!-- 预加载字体（系统字体，无需联网） -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- 主题预应用，避免闪烁 -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('lollipop-theme');
          var prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          var theme = stored || (prefersLight ? 'light' : 'dark');
          document.documentElement.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>

    <title>Lollipop · Home</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
