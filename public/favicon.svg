<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.5" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#fb923c"/>
    </linearGradient>
    <radialGradient id="g2" cx="20" cy="20" r="22" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="#0b0b14"/>
  <!-- 棒棒糖：糖在顶端，棍子向下 -->
  <g transform="translate(32 32) rotate(-15) translate(-32 -32)">
    <!-- 糖：圆形，在上方 -->
    <circle cx="32" cy="20" r="14" fill="url(#g1)"/>
    <!-- 高光 -->
    <ellipse cx="26" cy="15" rx="5" ry="3" fill="#fff" opacity="0.6"/>
    <circle cx="32" cy="20" r="14" fill="url(#g2)" opacity="0.7"/>
    <!-- 棍子：从糖的下方延伸到画面底部 -->
    <rect x="30" y="28" width="4" height="32" rx="2" fill="#f8fafc"/>
  </g>
</svg>